principles:
  - name: Visibility
    description: Satellite itself is the inventory tool — use its host registration data to
      reconcile entitlement counts against the active subscription.
  - name: Allocation
    description: Allocate Satellite subscription cost to the platform team that operates the
      Satellite server; managed-host counts can be attributed to consuming business units via
      host group / organization metadata.
  - name: Optimization
    description: Reclaim entitlements from decommissioned hosts via Satellite's host-unregister
      flow; consolidate Satellite organizations to reduce server footprint.
  - name: Accountability
    description: Platform / infrastructure operations owns the Satellite subscription; consuming
      app teams own their managed-host counts.

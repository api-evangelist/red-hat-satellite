description: Red Hat Satellite is the Red Hat infrastructure management product (provisioning,
  configuration, patching, errata for RHEL fleets). The product page does not publish per-tier
  pricing; commercial terms are negotiated through "Talk to a Red Hatter" / Red Hat sales,
  typically sized by managed-host count.
sources:
  - https://www.redhat.com/en/technologies/management/satellite
notes: Satellite product page lists no pricing; subscription is contact-sales. Treat as gated.
plans:
  - id: red-hat-satellite-contact-sales
    name: Contact Sales
    type: enterprise
    description: Production Satellite subscriptions are quoted by Red Hat sales, sized by managed-host
      count and support level.
    entries:
      - label: Custom subscription
        name: custom
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Provisioning and host lifecycle
      - name: Errata and patch management
      - name: Content views and lifecycle environments
      - name: Red Hat support (Standard or Premium)

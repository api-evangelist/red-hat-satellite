          example: '2026-01-15T10:30:00Z'
        last_report:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the last configuration management report.
          example: '2026-01-15T10:30:00Z'
    HostUpdate:
      type: object
      description: Parameters for updating an existing host.
      properties:
        name:
          type: string
          example: Example Title
        ip:
          type: string
          format: ipv4
          example: example_value
        mac:
          type: string
          example: example_value
        architecture_id:
          type: integer
          example: '500123'
        domain_id:
          type: integer
          example: '500123'
        subnet_id:
          type: integer
          example: '500123'
        operatingsystem_id:
          type: integer
          example: '500123'
        hostgroup_id:
          type: integer
          example: '500123'
        location_id:
          type: integer
          example: '500123'
        organization_id:
          type: integer
          example: '500123'
        owner_id:
          type: integer
          example: '500123'
        owner_type:
          type: string
          enum:
          - User
          - Usergroup
          example: User
        build:
          type: boolean
          example: true
        managed:
          type: boolean
          example: true
        comment:
          type: string
          example: example_value
        content_facet_attributes:
          type: object
          properties:
            content_view_id:
              type: integer
            lifecycle_environment_id:
              type: integer
            content_source_id:
              type: integer
          example: example_value
        interfaces_attributes:
          type: array
          items:
            $ref: '#/components/schemas/HostInterfaceCreate'
          example: []
    HostInterfaceCreate:
      type: object
      description: Parameters for creating or updating a host network interface.
      properties:
        id:
          type: integer
          description: Interface identifier (for updating existing interfaces).
          example: abc123
        mac:
          type: string
          description: MAC address.
          example: example_value
        ip:
          type: string
          description: IPv4 address.
          format: ipv4
          example: example_value
        ip6:
          type: string
          description: IPv6 address.
          format: ipv6
          example: example_value
        type:
          type: string
          description: Interface type.
          enum:
          - interface
          - bmc
          - bond
          - bridge
          example: interface
        name:
          type: string
          description: DNS name.
          example: Example Title
        subnet_id:
          type: integer
          description: IPv4 subnet identifier.
          example: '500123'
        subnet6_id:
          type: integer
          description: IPv6 subnet identifier.
          example: '500123'
        domain_id:
          type: integer
          description: Domain identifier.
          example: '500123'
        identifier:
          type: string
          description: Device identifier (e.g., eth0).
          example: example_value
        managed:
          type: boolean
          description: Whether DNS and DHCP are managed for this interface.
          example: true
        primary:
          type: boolean
          description: Whether this is the primary interface for FQDN.
          example: true
        provision:
          type: boolean
          description: Whether this interface is used for provisioning.
          example: true
        virtual:
          type: boolean
          description: Whether this is a virtual interface (alias or VLAN).
          example: true
        tag:
          type: string
          description: VLAN tag.
          example: example_value
        mtu:
          type: integer
          description: Maximum transmission unit.
          example: 10
        attached_to:
          type: string
          description: Parent interface identifier.
          example: example_value
        username:
          type: string
          description: BMC username (BMC interfaces only).
          example: example_value
        password:
          type: string
          description: BMC password (BMC interfaces only).
          format: password
          example: example_value
        provider:
          type: string
          description: BMC provider (BMC interfaces only).
          enum:
          - IPMI
          - Redfish
          - SSH
          example: IPMI
        mode:
          type: string
          description: Bond mode (bond interfaces only).
          enum:
          - balance-rr
          - active-backup
          - balance-xor
          - broadcast
          - 802.3ad
          - balance-tlb
          - balance-alb
          example: balance-rr
        attached_devices:
          type: array
          description: Slave or bridge member interface identifiers.
          items:
            type: string
          example: []
        bond_options:
          type: string
          description: Additional bond options (space-separated).
          example: example_value
  parameters:
    hostId:
      name: id
      in: path
      required: true
      description: Host identifier (numeric ID or FQDN).
      schema:
        type: string
    orderQuery:
      name: order
      in: query
      description: Sort field and direction (e.g., "name ASC" or "id DESC").
      schema:
        type: string
    perPageQuery:
      name: per_page
      in: query
      description: Number of results per page. Use "all" to retrieve all results without pagination.
      schema:
        oneOf:
        - type: integer
          minimum: 1
        - type: string
          enum:
          - all
        default: 20
    locationIdQuery:
      name: location_id
      in: query
      description: Set the current location context for the request.
      schema:
        type: integer
    pageQuery:
      name: page
      in: query
      description: Page number for paginated results (starting at 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    searchQuery:
      name: search
      in: query
      description: Scoped search query string to filter results. Supports field-based search syntax (e.g., "name ~ web*").
      schema:
        type: string
    organizationIdQuery:
      name: organization_id
      in: query
      description: Set the current organization context for the request.
      schema:
        type: integer
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                    example: Resource not found.
    Unauthorized:
      description: Authentication credentials are missing or invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                    example: Unable to authenticate user.
    UnprocessableEntity:
      description: The request was well-formed but contained validation errors.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  id:
                    type: integer
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  full_messages:
                    type: array
                    items:
                      type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using Satellite username and password.
    oAuth2:
      type: oauth2
      description: OAuth 2.0 Personal Access Token authentication for Satellite users.
      flows:
        implicit:
          authorizationUrl: https://satellite.example.com/users/extlogin
          scopes: {}
externalDocs:

openapi: 3.1.0
info:
  title: Red Hat Satellite REST Content Views Hosts API
  description: The Red Hat Satellite REST API provides programmatic access to Red Hat Satellite server functionality including host management, content view management, subscription management, lifecycle environments, and provisioning. The API is built on the Foreman and Katello upstream projects and follows RESTful conventions with JSON request and response bodies.
  version: 6.18.0
  contact:
    name: Red Hat Support
    url: https://access.redhat.com/support
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  x-logo:
    url: https://www.redhat.com/profiles/rh/themes/redhatdotcom/img/logo.png
servers:
- url: https://satellite.example.com
  description: Red Hat Satellite Server
security:
- basicAuth: []
- oAuth2: []
tags:
- name: Hosts
  description: Manage hosts registered with Red Hat Satellite including physical, virtual, and cloud instances.
  externalDocs:
    url: https://apidocs.theforeman.org/foreman/latest/apidoc/v2/hosts.html
paths:
  /api/v2/hosts:
    get:
      operationId: listHosts
      summary: List All Hosts
      description: Retrieve a paginated list of all hosts registered with the Satellite server. Supports filtering by organization, location, host group, and search queries.
      tags:
      - Hosts
      parameters:
      - $ref: '#/components/parameters/organizationIdQuery'
      - $ref: '#/components/parameters/locationIdQuery'
      - name: hostgroup_id
        in: query
        description: Filter hosts by host group identifier.
        schema:
          type: integer
        example: '500123'
      - name: thin
        in: query
        description: Only return the ID and name of each host.
        schema:
          type: boolean
          default: false
        example: true
      - name: include
        in: query
        description: Additional information to include (e.g., parameters, all_parameters).
        schema:
          type: string
          enum:
          - parameters
          - all_parameters
        example: parameters
      - $ref: '#/components/parameters/searchQuery'
      - $ref: '#/components/parameters/orderQuery'
      - $ref: '#/components/parameters/pageQuery'
      - $ref: '#/components/parameters/perPageQuery'
      responses:
        '200':
          description: Successful response containing a list of hosts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of hosts matching the query.
                  subtotal:
                    type: integer
                    description: Number of hosts after filtering.
                  page:
                    type: integer
                    description: Current page number.
                  per_page:
                    type: integer
                    description: Number of results per page.
                  search:
                    type:
                    - string
                    - 'null'
                    description: Applied search filter.
                  sort:
                    type: object
                    properties:
                      by:
                        type:
                        - string
                        - 'null'
                      order:
                        type:
                        - string
                        - 'null'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Host'
              examples:
                Listhosts200Example:
                  summary: Default listHosts 200 response
                  x-microcks-default: true
                  value:
                    total: 10
                    subtotal: 10
                    page: 10
                    per_page: 10
                    search: example_value
                    sort:
                      by: example_value
                      order: example_value
                    results:
                    - id: abc123
                      name: Example Title
                      ip: example_value
                      ip6: example_value
                      mac: example_value
                      environment_id: '500123'
                      hostgroup_id: '500123'
                      hostgroup_name: example_value
                      hostgroup_title: example_value
                      operatingsystem_id: '500123'
                      operatingsystem_name: example_value
                      architecture_id: '500123'
                      architecture_name: example_value

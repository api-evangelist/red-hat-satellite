              type: string
              format: date-time
            last_checkin:
              type:
              - string
              - 'null'
              format: date-time
            service_level:
              type:
              - string
              - 'null'
            release_version:
              type:
              - string
              - 'null'
            autoheal:
              type: boolean
            registered_through:
              type:
              - string
              - 'null'
          example: example_value
        interfaces:
          type: array

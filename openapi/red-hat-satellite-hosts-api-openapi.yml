          example: example_value
        architecture_id:
          type:
          - integer
          - 'null'
          description: Architecture identifier.
          example: '500123'
        architecture_name:
          type:
          - string
          - 'null'
          description: Architecture name (e.g., x86_64).
          example: example_value
        domain_id:
          type:
          - integer
          - 'null'
          description: DNS domain identifier.
          example: '500123'
        domain_name:
          type:
          - string
          - 'null'
          description: DNS domain name.
          example: example_value
        subnet_id:
          type:
          - integer
          - 'null'
          description: IPv4 subnet identifier.
          example: '500123'
        subnet_name:
          type:
          - string
          - 'null'
          description: IPv4 subnet name.
          example: example_value
        subnet6_id:
          type:
          - integer
          - 'null'
          description: IPv6 subnet identifier.
          example: '500123'
        compute_resource_id:
          type:
          - integer
          - 'null'
          description: Compute resource identifier. Null for bare metal hosts.
          example: '500123'
        compute_resource_name:
          type:
          - string
          - 'null'
          description: Compute resource name.
          example: example_value
        compute_profile_id:
          type:
          - integer
          - 'null'
          description: Compute profile identifier.
          example: '500123'
        medium_id:
          type:
          - integer
          - 'null'
          description: Installation medium identifier.
          example: '500123'
        ptable_id:
          type:
          - integer
          - 'null'
          description: Partition table identifier.
          example: '500123'
        model_id:
          type:
          - integer
          - 'null'
          description: Hardware model identifier.
          example: '500123'
        model_name:
          type:
          - string
          - 'null'
          description: Hardware model name.
          example: example_value
        location_id:
          type: integer
          description: Location identifier.
          example: '500123'
        location_name:
          type: string
          description: Location name.
          example: example_value
        organization_id:
          type: integer
          description: Organization identifier.
          example: '500123'
        organization_name:
          type: string
          description: Organization name.
          example: example_value
        owner_id:
          type:
          - integer
          - 'null'
          description: Owner identifier.
          example: '500123'
        owner_type:
          type:
          - string
          - 'null'
          description: Owner type (User or Usergroup).
          enum:
          - User
          - Usergroup
          - null
          example: User
        managed:
          type: boolean
          description: Whether the host is managed by Satellite for provisioning and configuration.
          example: true
        build:
          type: boolean
          description: Whether the host is in build mode.
          example: true
        enabled:
          type: boolean
          description: Whether configuration management reports are evaluated for this host.
          example: true
        comment:
          type:
          - string
          - 'null'
          description: Additional information about the host.
          example: example_value
        uuid:
          type:
          - string
          - 'null'
          description: Unique identifier from compute resource.
          example: '500123'
        global_status:
          type: integer
          description: Global status of the host (0=OK, 1=Warning, 2=Error).
          example: 10
        global_status_label:
          type: string
          description: Human-readable global status label.
          enum:
          - OK
          - Warning
          - Error

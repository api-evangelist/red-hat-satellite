          example: '2026-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the host was last updated.
          example: '2026-01-15T10:30:00Z'
        installed_at:
          type:
          - string
          - 'null'
          format: date-time

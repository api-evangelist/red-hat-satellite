              - 'null'
            errata_counts:
              type: object
              properties:
                security:
                  type: integer
                bugfix:
                  type: integer
                enhancement:
                  type: integer
                total:
                  type: integer
            applicable_errata_count:
              type: integer
            upgradable_package_count:
              type: integer
          example: example_value
        subscription_facet_attributes:
          type: object

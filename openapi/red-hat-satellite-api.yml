  /api/v2/hosts/{id}/power:
    put:
      operationId: hostPowerAction
      summary: Execute a Power Operation on a Host
      description: >-
        Perform a power management action on a host such as powering on,
        powering off, or rebooting. Requires a BMC or compute resource
        association.
      tags:
      - Hosts
      parameters:
      - $ref: '#/components/parameters/hostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - power_action
              properties:
                power_action:
                  type: string
                  description: Power action to perform.
                  enum:
                  - start
                  - stop
                  - reboot
                  - status
            examples:
              HostpoweractionRequestExample:
                summary: Default hostPowerAction request
                x-microcks-default: true
                value:
                  power_action: start
      responses:
        '200':
          description: Power action executed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  power:
                    type: string
                  id:
                    type: integer
              examples:
                Hostpoweraction200Example:
                  summary: Default hostPowerAction 200 response
                  x-microcks-default: true
                  value:
                    power: example_value
                    id: abc123
        '404':
          $ref: '#/components/responses/NotFound'
        '422':

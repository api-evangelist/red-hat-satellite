      description: Content view identifier.
      schema:
        type: integer
    organizationIdQuery:
      name: organization_id
      in: query
      description: Set the current organization context for the request.
      schema:
        type: integer
    locationIdQuery:
      name: location_id
      in: query
      description: Set the current location context for the request.
      schema:
        type: integer
    searchQuery:
      name: search
      in: query
      description: >-
        Scoped search query string to filter results. Supports field-based
        search syntax (e.g., "name ~ web*").
      schema:
        type: string
    orderQuery:
      name: order
      in: query
      description: >-
        Sort field and direction (e.g., "name ASC" or "id DESC").
      schema:
        type: string
    pageQuery:
      name: page
      in: query
      description: Page number for paginated results (starting at 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    perPageQuery:
      name: per_page
      in: query
      description: >-
        Number of results per page. Use "all" to retrieve all results
        without pagination.
      schema:
        oneOf:
        - type: integer
          minimum: 1
        - type: string
          enum:
          - all
        default: 20

description: Red Hat Satellite is a customer-deployed system-management product. Its REST API
  runs in the customer's own Satellite server; throughput is bounded by that deployment's sizing
  rather than by a Red Hat-published rate limit. No platform-wide rate-limit policy is published.
sources:
  - https://www.redhat.com/en/technologies/management/satellite
notes: Satellite is self-hosted; the only "limit" is the customer's deployment capacity. Red
  Hat publishes sizing guidance, not a rate ceiling.
responseCodes: {}
limits:
  - name: Self-hosted deployment capacity
    scope: deployment
    metric: varies
    limit: 'bounded by customer Satellite server sizing; see Red Hat Satellite sizing guide'
policies:
  - name: Customer-Operated Throttling
    description: Because Satellite is run on customer-owned infrastructure, any throttling is
      configured by the customer; Red Hat publishes sizing recommendations rather than a request
      ceiling.

naftiko: "1.0.0-alpha1"

info:
  label: "Red Hat Satellite REST API"
  description: "Programmatic access to Red Hat Satellite server functionality including host management, content view management, subscription management, lifecycle environments, and provisioning."
  tags:
    - Red Hat Satellite
    - Systems Management
    - Host Management
    - Content Management
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      SATELLITE_USERNAME: SATELLITE_USERNAME
      SATELLITE_PASSWORD: SATELLITE_PASSWORD

capability:
  consumes:
    - type: http
      namespace: satellite-api
      baseUri: https://satellite.example.com
      description: "Red Hat Satellite REST API for systems lifecycle management."
      authentication:
        type: basic
        username: "{{SATELLITE_USERNAME}}"
        password: "{{SATELLITE_PASSWORD}}"
      resources:
        - name: hosts
          path: /api/v2/hosts
          description: "Manage hosts registered with Satellite."
          operations:
            - name: list-hosts
              method: GET
              description: "List all hosts registered with the Satellite server."
              inputParameters:
                - name: organization_id
                  in: query
                  type: integer
                  required: false
                  description: "Filter by organization ID."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search query filter."
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Results per page."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-host
              method: POST
              description: "Register a new host with the Satellite server."
              inputParameters:
                - name: organization_id
                  in: query
                  type: integer
                  required: false
                  description: "Organization ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  host: "{{tools.host}}"
        - name: host-details
          path: /api/v2/hosts/{id}
          description: "Manage individual host details."
          operations:
            - name: show-host
              method: GET
              description: "Retrieve details for a specific host."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Host identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-host
              method: PUT
              description: "Update the attributes of an existing host."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Host identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  host: "{{tools.host}}"
            - name: delete-host
              method: DELETE
              description: "Delete a host from the Satellite server."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Host identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: host-power
          path: /api/v2/hosts/{id}/power
          description: "Manage host power state."
          operations:
            - name: host-power-action
              method: PUT
              description: "Execute a power action on a host."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Host identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  power_action: "{{tools.power_action}}"
        - name: content-views
          path: /katello/api/v2/content_views
          description: "Manage content views."
          operations:
            - name: list-content-views
              method: GET
              description: "List all content views in an organization."
              inputParameters:
                - name: organization_id
                  in: query
                  type: integer
                  required: true
                  description: "Organization ID."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search query."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-content-view
              method: POST
              description: "Create a new content view."
              inputParameters:
                - name: organization_id
                  in: query
                  type: integer
                  required: true
                  description: "Organization ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
        - name: content-view-details
          path: /katello/api/v2/content_views/{id}
          description: "Manage individual content view."
          operations:
            - name: show-content-view
              method: GET
              description: "Retrieve details for a content view."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Content view ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-content-view
              method: PUT
              description: "Update a content view."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Content view ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
            - name: delete-content-view
              method: DELETE
              description: "Delete a content view."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Content view ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: content-view-publish
          path: /katello/api/v2/content_views/{id}/publish
          description: "Publish a content view version."
          operations:
            - name: publish-content-view
              method: POST
              description: "Publish a new version of a content view."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Content view ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: content-view-promote
          path: /katello/api/v2/content_view_versions/{id}/promote
          description: "Promote a content view version."
          operations:
            - name: promote-content-view-version
              method: POST
              description: "Promote a content view version to an environment."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Content view version ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  environment_id: "{{tools.environment_id}}"
        - name: subscriptions
          path: /katello/api/v2/organizations/{organization_id}/subscriptions
          description: "Manage subscriptions."
          operations:
            - name: list-subscriptions
              method: GET
              description: "List subscriptions for an organization."
              inputParameters:
                - name: organization_id
                  in: path
                  type: integer
                  required: true
                  description: "Organization ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: upload-subscription-manifest
              method: POST
              description: "Upload a subscription manifest."
              inputParameters:
                - name: organization_id
                  in: path
                  type: integer
                  required: true
                  description: "Organization ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-subscription-manifest
              method: POST
              description: "Delete a subscription manifest."
              inputParameters:
                - name: organization_id
                  in: path
                  type: integer
                  required: true
                  description: "Organization ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: refresh-subscription-manifest
              method: PUT
              description: "Refresh a subscription manifest."
              inputParameters:
                - name: organization_id
                  in: path
                  type: integer
                  required: true
                  description: "Organization ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: lifecycle-environments
          path: /katello/api/v2/organizations/{organization_id}/environments
          description: "Manage lifecycle environments."
          operations:
            - name: list-lifecycle-environments
              method: GET
              description: "List lifecycle environments for an organization."
              inputParameters:
                - name: organization_id
                  in: path
                  type: integer
                  required: true
                  description: "Organization ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-lifecycle-environment
              method: POST
              description: "Create a new lifecycle environment."
              inputParameters:
                - name: organization_id
                  in: path
                  type: integer
                  required: true
                  description: "Organization ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  prior_id: "{{tools.prior_id}}"
        - name: organizations
          path: /api/v2/organizations
          description: "Manage organizations."
          operations:
            - name: list-organizations
              method: GET
              description: "List all organizations."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: show-organization
              method: GET
              description: "Show details for a specific organization."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Organization ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: satellite-rest
      resources:
        - path: /v1/hosts
          name: hosts
          description: "Host management endpoints."
          operations:
            - method: GET
              name: list-hosts
              description: "List all managed hosts."
              call: "satellite-api.list-hosts"
            - method: POST
              name: create-host
              description: "Create a new host."
              call: "satellite-api.create-host"
        - path: /v1/hosts/{id}
          name: host-details
          description: "Individual host endpoints."
          operations:
            - method: GET
              name: show-host
              description: "Get host details."
              call: "satellite-api.show-host"
            - method: PUT
              name: update-host
              description: "Update a host."
              call: "satellite-api.update-host"
            - method: DELETE
              name: delete-host
              description: "Delete a host."
              call: "satellite-api.delete-host"

    - type: mcp
      port: 9100
      namespace: satellite-mcp
      transport: http
      tools:
        - name: list-hosts
          description: "List all hosts registered with Satellite."
          hints:
            readOnly: true
            openWorld: true
          call: "satellite-api.list-hosts"
          outputParameters:
            - type: object
              mapping: "$."
        - name: show-host
          description: "Get details for a specific host."
          hints:
            readOnly: true
            idempotent: true
          call: "satellite-api.show-host"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-host
          description: "Register a new host."
          hints:
            readOnly: false
          call: "satellite-api.create-host"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-host
          description: "Update host attributes."
          hints:
            readOnly: false
            idempotent: true
          call: "satellite-api.update-host"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-host
          description: "Delete a host."
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "satellite-api.delete-host"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: host-power-action
          description: "Execute a power action on a host."
          hints:
            readOnly: false
            destructive: true
          call: "satellite-api.host-power-action"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-content-views
          description: "List content views in an organization."
          hints:
            readOnly: true
          call: "satellite-api.list-content-views"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-content-view
          description: "Create a new content view."
          hints:
            readOnly: false
          call: "satellite-api.create-content-view"
          outputParameters:
            - type: object
              mapping: "$."
        - name: show-content-view
          description: "Get details for a content view."
          hints:
            readOnly: true
            idempotent: true
          call: "satellite-api.show-content-view"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-content-view
          description: "Update a content view."
          hints:
            readOnly: false
            idempotent: true
          call: "satellite-api.update-content-view"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-content-view
          description: "Delete a content view."
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "satellite-api.delete-content-view"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: publish-content-view
          description: "Publish a new version of a content view."
          hints:
            readOnly: false
          call: "satellite-api.publish-content-view"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: promote-content-view-version
          description: "Promote a content view version to an environment."
          hints:
            readOnly: false
          call: "satellite-api.promote-content-view-version"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-subscriptions
          description: "List subscriptions for an organization."
          hints:
            readOnly: true
          call: "satellite-api.list-subscriptions"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-lifecycle-environments
          description: "List lifecycle environments for an organization."
          hints:
            readOnly: true
          call: "satellite-api.list-lifecycle-environments"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-lifecycle-environment
          description: "Create a new lifecycle environment."
          hints:
            readOnly: false
          call: "satellite-api.create-lifecycle-environment"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-organizations
          description: "List all organizations."
          hints:
            readOnly: true
          call: "satellite-api.list-organizations"
          outputParameters:
            - type: object
              mapping: "$."
        - name: show-organization
          description: "Show details for a specific organization."
          hints:
            readOnly: true
            idempotent: true
          call: "satellite-api.show-organization"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
